name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Install project
        run: python -m pip install --no-deps -e .
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Mypy
        run: python -m mypy
      - name: Tests
        env:
          SORTAX_APP_ENV: test
          SORTAX_JWT_SECRET: ci-test-secret-that-is-at-least-32-characters
        run: python -m pytest
