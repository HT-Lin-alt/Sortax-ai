[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sortax"
version = "0.1.0"
description = "Chat backend for the Sortax intelligent accounting platform"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20,<2.0",
    "asyncpg>=0.31,<0.32",
    "celery[redis]>=5.5,<6.0",
    "fastapi>=0.115,<1.0",
    "openai>=3.0,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "pypdf>=6.0,<7.0",
    "pymilvus>=3.0,<3.1",
    "PyJWT>=2.9,<3.0",
    "PyYAML>=6.0,<7.0",
    "SQLAlchemy[asyncio]>=2.1,<2.2",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21,<1.0",
    "httpx>=0.27,<1.0",
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<5.0",
    "PyYAML>=6.0,<7.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
    "types-PyYAML>=6.0,<7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sortax"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: explicit, potentially billable tests against external providers",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sortax"]

[[tool.mypy.overrides]]
module = ["pymilvus", "pymilvus.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["sortax"]

[tool.coverage.report]
show_missing = true
skip_covered = true
