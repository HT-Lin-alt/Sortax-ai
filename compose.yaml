name: sortax

x-app-environment: &app-environment
  SORTAX_APP_ENV: development
  SORTAX_JWT_SECRET: ${SORTAX_JWT_SECRET:?Set SORTAX_JWT_SECRET in .env}
  SORTAX_JWT_ISSUER: sortax-dev
  SORTAX_JWT_AUDIENCE: sortax-api
  SORTAX_LOG_LEVEL: INFO
  SORTAX_DATABASE_ENABLED: "true"
  SORTAX_DATABASE_URL: postgresql+asyncpg://sortax:${SORTAX_POSTGRES_PASSWORD:?Set SORTAX_POSTGRES_PASSWORD in .env}@postgres:5432/sortax
  SORTAX_REDIS_URL: redis://redis:6379/0
  SORTAX_REDIS_ENABLED: "true"
  SORTAX_CELERY_BROKER_URL: redis://redis:6379/1
  SORTAX_CELERY_RESULT_BACKEND: redis://redis:6379/2
  SORTAX_LLM_PROVIDER: ${SORTAX_LLM_PROVIDER:-fake}
  SORTAX_LLM_MODEL: ${SORTAX_LLM_MODEL:-fake-chat-v1}
  SORTAX_LLM_API_KEY: ${SORTAX_LLM_API_KEY:-}
  SORTAX_QWEN_BASE_URL: ${SORTAX_QWEN_BASE_URL:-https://maas.qianwenaiapi.com/compatible-mode/v1}
  SORTAX_QWEN_API_KEY: ${SORTAX_QWEN_API_KEY:-}
  SORTAX_LLM_REQUEST_TIMEOUT_SECONDS: ${SORTAX_LLM_REQUEST_TIMEOUT_SECONDS:-60}
  SORTAX_LLM_MAX_OUTPUT_TOKENS: ${SORTAX_LLM_MAX_OUTPUT_TOKENS:-1024}
  SORTAX_INTENT_CLASSIFIER_PROVIDER: ${SORTAX_INTENT_CLASSIFIER_PROVIDER:-fake}
  SORTAX_CLASSIFIER_MODEL: ${SORTAX_CLASSIFIER_MODEL:-fake-intent-v1}
  SORTAX_CLASSIFIER_TIMEOUT_SECONDS: ${SORTAX_CLASSIFIER_TIMEOUT_SECONDS:-10}
  SORTAX_CLASSIFIER_MAX_OUTPUT_TOKENS: ${SORTAX_CLASSIFIER_MAX_OUTPUT_TOKENS:-96}
  SORTAX_FIRST_TOKEN_TIMEOUT_SECONDS: ${SORTAX_FIRST_TOKEN_TIMEOUT_SECONDS:-30}
  SORTAX_STREAM_HEARTBEAT_SECONDS: ${SORTAX_STREAM_HEARTBEAT_SECONDS:-15}
  SORTAX_STREAM_MAX_DURATION_SECONDS: ${SORTAX_STREAM_MAX_DURATION_SECONDS:-300}
  SORTAX_CANCELLATION_POLL_SECONDS: ${SORTAX_CANCELLATION_POLL_SECONDS:-0.5}
  SORTAX_CANCELLATION_TTL_SECONDS: ${SORTAX_CANCELLATION_TTL_SECONDS:-600}
  SORTAX_MILVUS_ENABLED: "true"
  SORTAX_MILVUS_URI: http://milvus:19530
  SORTAX_MILVUS_DATABASE: default
  SORTAX_MILVUS_COLLECTION: ato_knowledge_demo
  SORTAX_MILVUS_CONNECT_TIMEOUT_SECONDS: "10"
  SORTAX_ATO_DATA_DIR: /app/data/ato
  SORTAX_ATO_MANIFEST_PATH: /app/manifests/ato/sources.yaml
  SORTAX_EMBEDDING_PROVIDER: fake
  SORTAX_EMBEDDING_MODEL: fake-embedding-v1
  SORTAX_EMBEDDING_DIMENSIONS: "64"

services:
  api:
    build:
      context: .
    environment: *app-environment
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn sortax.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data/ato:/app/data/ato:ro
      - ./manifests/ato:/app/manifests/ato:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
    environment: *app-environment
    command:
      - celery
      - --app=sortax.workers.celery_app:celery_app
      - worker
      - --loglevel=INFO
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sortax
      POSTGRES_USER: sortax
      POSTGRES_PASSWORD: ${SORTAX_POSTGRES_PASSWORD:?Set SORTAX_POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sortax -d sortax"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - -advertise-client-urls=http://etcd:2379
      - -listen-client-urls
      - http://0.0.0.0:2379
      - --data-dir
      - /etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    volumes:
      - minio-data:/minio_data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v3.0.2
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  etcd-data:
  minio-data:
  milvus-data:
